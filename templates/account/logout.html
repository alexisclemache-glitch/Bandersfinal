{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <i class="ri-logout-circle-line text-danger display-1"></i>
                </div>
                <h3 class="fw-bold">¿Cerrar sesión en Banders?</h3>
                <p class="text-muted mb-4">Tu sesión de Google y MFA se cerrarán de forma segura.</p>

                <form method="post" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger btn-lg">SÍ, SALIR AHORA</button>
                        <a href="/" class="btn btn-light">No, mantenerme conectado</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
