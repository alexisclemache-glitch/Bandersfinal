{% extends "base.html" %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block account_content %}
<div class="auth-card-custom">
    <div class="text-center mb-4">
        <h4 class="text-primary fw-bold">Verificar Código</h4>
        <p class="text-muted">Hemos enviado un código a su correo para proteger su cuenta.</p>
    </div>

    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary w-100 shadow mt-3">Confirmar Código</button>
    </form>
</div>
{% endblock account_content %}
