{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5 text-center">
                    <div class="mb-4">
                        <iconify-icon icon="solar:lock-password-bold-duotone" class="text-primary display-1"></iconify-icon>
                    </div>
                    
                    <h2 class="fw-bold mb-3">Confirmar Contraseña</h2>
                    <p class="text-muted mb-4">Para configurar el MFA, primero debemos verificar que eres tú. Ingresa tu contraseña actual.</p>

                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="text-start mb-4">
                            {{ form|crispy }}
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm fw-bold">
                            Verificar e ir al QR
                        </button>
                    </form>

                    <div class="mt-4">
                        <a href="{% url 'dashboard:dashboard' %}" class="text-decoration-none text-muted small">
                            <iconify-icon icon="solar:arrow-left-bold" class="align-middle"></iconify-icon> 
                            Cancelar y volver al inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
